# nginx-security.conf: HTTPS and security headers in front of an app (for example secure-server.js on 127.0.0.1:3000).
# Put this server block in /etc/nginx/sites-available/, link it from sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
# Certificates: free and automatic from Let's Encrypt with certbot (sudo certbot --nginx -d example.com).

# Plain HTTP: only redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # TLS 1.2 and 1.3 only; with TLS 1.2, only forward-secret AEAD cipher suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Security headers ("always": on error responses too)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Don't advertise the nginx version
    server_tokens off;

    # Limit request sizes, and slow down brute force on the login endpoint
    client_max_body_size 10m;
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Never serve dotfiles (.git, .env…)
    location ~ /\. { deny all; }
}

# The rate-limit zone must be declared at http level (for example in /etc/nginx/conf.d/limits.conf):
#   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
