#!/usr/sbin/nft -f
# /etc/nftables.conf: a default-deny firewall for a web server.
#
#   sudo nft -c -f /etc/nftables.conf     # check the syntax without applying it
#   sudo nft -f /etc/nftables.conf        # apply
#   sudo systemctl enable nftables        # load at boot
#   sudo nft list ruleset                 # what's active
#
# Working remotely? Apply it with a safety net, so a mistake undoes itself after 2 minutes:
#   sudo nft -f /etc/nftables.conf; sleep 120; sudo nft flush ruleset
# (press Ctrl+C before the 2 minutes are up if you can still connect)

flush ruleset

table inet filter {
    # Addresses allowed to use SSH: your office, VPN or bastion host
    set ssh_allowed_v4 {
        type ipv4_addr
        flags interval
        elements = { 192.0.2.0/24, 198.51.100.10 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Replies to connections we started, and packets of connections we already accepted
        ct state established,related accept
        ct state invalid drop

        # Loopback: local services talking to each other
        iif "lo" accept

        # ICMP: ping and error messages (path MTU discovery needs them). IPv6 doesn't work without ICMPv6.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
        meta l4proto ipv6-icmp accept

        # SSH only from the allowed addresses (fail2ban adds its own bans on top)
        tcp dport 22 ip saddr @ssh_allowed_v4 accept

        # The public web server
        tcp dport { 80, 443 } accept

        # Everything else: log a sample, then the policy drops it
        limit rate 5/minute log prefix "nft input drop: " level info
    }

    chain forward {
        # Not a router: forward nothing
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
        # Stricter servers allow only what they need going out (DNS, NTP, updates), which hampers attackers
        # who got in and want to download tools or exfiltrate data. Start with accept, and tighten later.
    }
}
