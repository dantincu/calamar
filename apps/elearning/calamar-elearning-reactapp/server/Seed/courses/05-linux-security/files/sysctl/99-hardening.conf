# /etc/sysctl.d/99-hardening.conf
#   sudo sysctl --system          # apply all sysctl.d files now
#   sysctl kernel.kptr_restrict   # check one value
#
# Many distributions already set some of these. Test on a non-critical machine first: some settings
# break debuggers, container runtimes or routing setups (see the notes).

# --- Kernel information leaks ---------------------------------------------------
# Hide kernel addresses from everyone (they help attackers bypass KASLR)
kernel.kptr_restrict = 2
# Only root may read the kernel log
kernel.dmesg_restrict = 1
# No unprivileged eBPF programs (a frequent source of kernel exploits)
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# --- Processes ----------------------------------------------------------------------
# ptrace only on your own child processes (1). Use 2 (admin only) on servers; it breaks debugging with gdb -p.
kernel.yama.ptrace_scope = 1
# Don't allow replacing the running kernel with kexec
kernel.kexec_load_disabled = 1
# No core dumps of setuid programs: they may contain secrets
fs.suid_dumpable = 0

# --- Files ---------------------------------------------------------------------------
# Block the classic /tmp link and FIFO attacks on other users' files
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# --- Network: this machine is a host, not a router ------------------------------------
# Drop packets whose source address couldn't have arrived on that interface (anti-spoofing).
# Use 2 (loose) instead of 1 with asymmetric routing or multiple uplinks.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Ignore ICMP redirects (they could reroute our traffic) and don't send any
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Refuse source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
# Log packets with impossible addresses
net.ipv4.conf.all.log_martians = 1
# SYN flood protection
net.ipv4.tcp_syncookies = 1
# Don't answer pings sent to broadcast addresses (smurf amplification)
net.ipv4.icmp_echo_ignore_broadcasts = 1
