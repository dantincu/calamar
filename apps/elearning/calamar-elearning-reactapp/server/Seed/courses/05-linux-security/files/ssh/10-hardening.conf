# /etc/ssh/sshd_config.d/10-hardening.conf
#
# sshd uses the FIRST value it reads for most keywords, and the main sshd_config includes
# sshd_config.d/*.conf near its top, so these settings win over the defaults further down.
#
# Before reloading, ALWAYS:
#   1. check the syntax:          sudo sshd -t
#   2. see the effective values:  sudo sshd -T | grep -Ei 'permitroot|password|kbdinteractive|authenticationmethods'
#   3. keep your current session open, and test a NEW login from another terminal
#   4. then:                      sudo systemctl reload ssh     (the unit is "sshd" on the Red Hat family)

# --- Authentication: keys only, no root -----------------------------------
PermitRootLogin no
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Only members of this group may log in (create it: sudo groupadd ssh-users; sudo usermod -aG ssh-users ada)
AllowGroups ssh-users

# --- Slow down guessing and drop idle sessions -------------------------------
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 10:30:60
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Features most servers don't need -----------------------------------------
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
PermitUserEnvironment no

# --- Log the key fingerprint used for each login --------------------------------
LogLevel VERBOSE
